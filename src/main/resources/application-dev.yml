spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/${DB_NAME:contactmanager}
    username: postgres
    password: 12345
  sql:
    init:
      # SQL is written to be idempotent so this is safe
      mode: always
      schema-locations: classpath*:db/postgres/schema.sql
      data-locations: classpath*:db/postgres/data.sql
  jpa:
    show-sql: false
    defer-datasource-initialization: true
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
      dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  info:
    git:
      mode: full
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always

contacts:
  trace: ${CONTACT_TRACE:false}

logging:
  level:
    org:
      springframework:
        boot: WARN
      hibernate:
        SQL: ERROR
        orm:
          connections:
            # silencia el resumen de conexión de Hibernate (donde aparece "undefined/unknown")
            pooling: WARN
    com:
      zaxxer:
        # silencia los mensajes de inicio de HikariPool
        hikari: WARN
