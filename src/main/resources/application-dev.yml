spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/h2/contact-book-api;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  sql:
    init:
      # SQL is written to be idempotent so this is safe
      mode: always
      schema-locations: classpath*:db/h2/schema.sql
      data-locations: classpath*:db/h2/data.sql
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    show-sql: false
    defer-datasource-initialization: true
    open-in-view: false
    hibernate:
      ddl-auto: create-drop

management:
  info:
    git:
      mode: full
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always

contacts:
  trace: ${CONTACT_TRACE:false}

logging:
  level:
    org:
      springframework:
        boot: WARN
      hibernate:
        SQL: ERROR
        orm:
          connections:
            # silencia el resumen de conexión de Hibernate (donde aparece "undefined/unknown")
            pooling: WARN
    com:
      zaxxer:
        # silencia los mensajes de inicio de HikariPool
        hikari: WARN
