server:
  port: ${PORT:8080}
  servlet:
    context-path: ${CONTEXT_PATH:/}
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

spring:
  profiles:
    active: dev
  output:
    ansi:
      enabled: always
  config:
    import: optional:file:.env[.properties]

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: ${JWT_SECRET:mySecretKeyForJWTTokenGenerationAndValidationOfContactsBookThatMustBeAtLeast256BitsLong}
  expiration: ${JWT_EXPIRATION:86400000}

